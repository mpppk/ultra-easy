name: deploy-knowledge

# #185: CD for the Knowledge Workspace example app (apps/knowledge). Run manually from the
# Actions tab. Uses the `staging` GitHub environment (CLOUDFLARE_API_TOKEN secret,
# CLOUDFLARE_ACCOUNT_ID variable): Knowledge signs in against the staging Auth0 tenant and is
# not a production service.
# - Order is migrate -> deploy (`deploy` script). Knowledge migrations must stay backward
#   compatible with the running revision (expand / contract).
# - The deployed Worker always runs KNOWLEDGE_AUTH_MODE=auth0; demo mode exists only in the
#   local dev server. Worker secrets (SESSION_SECRET, KNOWLEDGE_MCP_TOKEN, AUTH0_CLIENT_ID,
#   AUTH0_CLIENT_SECRET) are managed with `wrangler secret put`, not by this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-knowledge
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "24"
          cache: true
      - name: Install dependencies
        run: vp install
      - name: Migrate then deploy
        run: vp -C apps/knowledge run deploy
      - name: Record deployed revision
        run: echo "Deployed ${GITHUB_SHA} (apps/knowledge)" >> "$GITHUB_STEP_SUMMARY"
