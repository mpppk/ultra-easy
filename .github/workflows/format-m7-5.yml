name: format-m7-5

on:
  push:
    branches:
      - feat/m7-5-attachment-integrity

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: 24
      - run: vp install
      - run: vp check --fix || true
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/approval-core/src/attachment.ts packages/approval-core/src/index.ts tests/acceptance/m7-attachment-integrity.test.ts tests/golden/m7-attachment-fingerprint.ts docs/attachment-integrity.md
          git commit -m "style: apply M7-5 formatting"
          git push
