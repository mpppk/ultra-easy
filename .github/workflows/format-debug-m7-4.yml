name: format-debug-m7-4

on:
  push:
    branches:
      - feat/m7-4-meta-approval-force-cancel

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: 24
      - run: vp install
      - name: Apply fixes
        run: vp check --fix || true
      - name: Commit formatter changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/approval-core/src/governance.ts packages/approval-d1/src/governance-repository.ts tests/acceptance/m7-governance.test.ts
          git commit -m "style: apply Vite+ formatting"
          git push
