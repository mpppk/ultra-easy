name: check

on:
  pull_request:

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          cache: true
      - name: Show Oxfmt diff
        run: |
          vp install
          vp check --fix || true
          git diff -- packages/approval-runtime-cloudflare/src/workflow.integration.test.ts
