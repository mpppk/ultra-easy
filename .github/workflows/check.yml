name: check

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Use fresh Workflow handles for lifecycle operations
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'packages/approval-runtime-cloudflare/src/workflow.integration.test.ts';
          const source = fs.readFileSync(path, 'utf8');
          const before = `    const instance = await createInstance(plan, id);\n    await introspector.waitForStatus("waiting");\n    await instance.pause();\n    await introspector.waitForStatus("paused");\n    await instance.resume();\n    await instance.sendEvent({`;
          const after = `    await createInstance(plan, id);\n    await introspector.waitForStatus("waiting");\n    const pausingInstance = await env.ACTION_WORKFLOW.get(id);\n    await pausingInstance.pause();\n    await introspector.waitForStatus("paused");\n    const resumingInstance = await env.ACTION_WORKFLOW.get(id);\n    await resumingInstance.resume();\n    const eventInstance = await env.ACTION_WORKFLOW.get(id);\n    await eventInstance.sendEvent({`;
          if (!source.includes(before)) process.exit(2);
          fs.writeFileSync(path, source.replace(before, after));
          NODE
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/approval-runtime-cloudflare/src/workflow.integration.test.ts
          git commit --no-verify -m "test: lifecycle操作ごとにWorkflow handleを再取得"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
