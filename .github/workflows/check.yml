name: check

on:
  pull_request:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          cache: true
      - name: Install dependencies
        run: vp install
      - name: Normalize OpenFGA adapter
        run: vp fmt packages/approval-fga/src/openfga.ts
      - name: Commit normalized file
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/approval-fga/src/openfga.ts
          git commit --no-verify -m "style: OpenFGA adapterを正規化"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
