name: check

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Wait for resumed workflow to run
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'packages/approval-runtime-cloudflare/src/workflow.integration.test.ts';
          const source = fs.readFileSync(path, 'utf8');
          const before = `    const resumingInstance = await env.ACTION_WORKFLOW.get(id);\n    await resumingInstance.resume();\n    const eventInstance = await env.ACTION_WORKFLOW.get(id);`;
          const after = `    const resumingInstance = await env.ACTION_WORKFLOW.get(id);\n    await resumingInstance.resume();\n    await vi.waitFor(\n      async () => {\n        expect((await resumingInstance.status()).status).toBe(\"running\");\n      },\n      { timeout: 1_500 },\n    );\n    const eventInstance = await env.ACTION_WORKFLOW.get(id);`;
          if (!source.includes(before)) process.exit(2);
          fs.writeFileSync(path, source.replace(before, after));
          NODE
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/approval-runtime-cloudflare/src/workflow.integration.test.ts
          git commit --no-verify -m "test: resume完了を確認してからDecisionを送信"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
