name: check

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-timeout-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Use real waitForEvent timeout
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'packages/approval-runtime-cloudflare/src/workflow.integration.test.ts';
          let source = fs.readFileSync(path, 'utf8');
          const before = `    const approval = await directStep("timeout", bob, "root", { expiresAfter: { seconds: 60 } });\n    const plan = await validPlan("cf-timeout", approval);\n    await savePlan(plan);\n\n    const id = "cf-timeout";\n    const introspector = await introspectWorkflowInstance(env.ACTION_WORKFLOW, id);\n    await introspector.modify(async (modifier) => {\n      await modifier.forceEventTimeout({ name: "wait for approval decision 0" });\n    });\n    await createInstance(plan, id);`;
          const after = `    const approval = await directStep("timeout", bob, "root", { expiresAfter: { seconds: 1 } });\n    const plan = await validPlan("cf-timeout", approval);\n    await savePlan(plan);\n\n    const id = "cf-timeout";\n    const introspector = await introspectWorkflowInstance(env.ACTION_WORKFLOW, id);\n    await createInstance(plan, id);`;
          if (!source.includes(before)) process.exit(2);
          source = source.replace(before, after);
          fs.writeFileSync(path, source);
          NODE
      - name: Commit test change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/approval-runtime-cloudflare/src/workflow.integration.test.ts
          git commit --no-verify -m "test: waitForEventの実timeoutでexpiryを検証"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
