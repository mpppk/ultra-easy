name: check

on:
  push:
    branches: [main]
  pull_request:
  # deploy.yml runs the same checks on the exact commit before deploying (#100).
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version: "24"
          cache: true
      - name: Install dependencies
        run: vp install
      - name: Check
        run: vp check
      - name: OpenFGA model tests (GitOps model source)
        run: |
          curl -fsSL https://github.com/openfga/cli/releases/download/v0.8.0/fga_0.8.0_linux_amd64.tar.gz | tar xz fga
          ./fga model test --tests packages/approval-fga/openfga/store.fga.yaml
      - name: Build Web Preview
        run: vp -C apps/web run build:preview
      - name: Dry-run Approval Runtime Preview
        run: vp -C apps/approval-runtime run deploy:dry-run
      # #84: stagingとproductionのwrangler環境（non-inheritableなbinding宣言）を検証する。
      - name: Dry-run Approval API (staging)
        run: vp -C apps/approval-api run deploy:dry-run
      - name: Dry-run Approval API (production)
        run: vp -C apps/approval-api run deploy:dry-run:production
      - name: Start OpenFGA test server
        run: |
          docker run --rm -d --name openfga-test -p 8080:8080 openfga/openfga:v1.18.1 run
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/healthz | grep -q '"status":"SERVING"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs openfga-test
          exit 1
      - name: Test
        env:
          OPENFGA_TEST_URL: http://127.0.0.1:8080
        run: vp run -r test
      - name: Stop OpenFGA test server
        if: always()
        run: docker rm -f openfga-test || true
