name: check

on:
  push:
    branches: [refactor/policy-result-byethrow]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/policy-result-byethrow
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          cache: true
      - name: Install dependencies
        run: vp install
      - name: Format
        run: vp check --fix || true
      - name: Commit format
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet packages/approval-core/src/condition-evaluator.ts; then
            git add packages/approval-core/src/condition-evaluator.ts
            git commit --no-verify -m "style: Condition evaluatorを再整形"
            git push
          fi
