name: check

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Preserve Workflow control-flow rejections
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'packages/approval-runtime-cloudflare/src/workflow.ts';
          let source = fs.readFileSync(path, 'utf8');

          const beforeWait = `const waitForDecision = Result.fn({\n  try: async (input: {\n    step: WorkflowStep;\n    name: string;\n    timeout: WorkflowSleepDuration;\n  }): Promise<ApprovalDecisionEvent> => {\n    const event = await input.step.waitForEvent<ApprovalDecisionEvent>(input.name, {\n      type: "approval-decision",\n      timeout: input.timeout,\n    });\n    return event.payload;\n  },\n  catch: (error): WorkflowEventWaitError =>\n    new WorkflowEventWaitError({\n      code: "workflow_event_wait_failed",\n      detail: error instanceof Error ? error.message : "waitForEvent failed",\n      ...(error instanceof Error ? { cause: error } : {}),\n    }),\n});`;
          const afterWait = `function isWorkflowTimeoutError(error: unknown): error is Error {\n  return error instanceof Error && error.name === "WorkflowTimeoutError";\n}\n\nfunction workflowEventWaitError(error: unknown): WorkflowEventWaitError {\n  return new WorkflowEventWaitError({\n    code: "workflow_event_wait_failed",\n    detail: error instanceof Error ? error.message : "waitForEvent failed",\n    ...(error instanceof Error ? { cause: error } : {}),\n  });\n}\n\nasync function waitForDecision(input: {\n  step: WorkflowStep;\n  name: string;\n  timeout: WorkflowSleepDuration;\n}): Promise<Result.Result<ApprovalDecisionEvent, WorkflowEventWaitError>> {\n  return input.step\n    .waitForEvent<ApprovalDecisionEvent>(input.name, {\n      type: "approval-decision",\n      timeout: input.timeout,\n    })\n    .then(\n      (event) => Result.succeed(event.payload),\n      (error) =>\n        isWorkflowTimeoutError(error)\n          ? Result.fail(workflowEventWaitError(error))\n          : Promise.reject(error),\n    );\n}`;
          if (!source.includes(beforeWait)) process.exit(2);
          source = source.replace(beforeWait, afterWait);

          const beforeFailure = `      if (Result.isFailure(decision)) {\n        if (!isTimeout(decision.error)) {\n          return outputFromTransition(params, failed(decision.error));\n        }\n        if (nextExpiry) {`;
          const afterFailure = `      if (Result.isFailure(decision)) {\n        if (nextExpiry) {`;
          if (!source.includes(beforeFailure)) process.exit(3);
          source = source.replace(beforeFailure, afterFailure);

          const beforeIsTimeout = `function isTimeout(error: WorkflowEventWaitError): boolean {\n  return /tim(?:e|ed)[ -]?out/i.test(error.detail);\n}\n\n`;
          if (!source.includes(beforeIsTimeout)) process.exit(4);
          source = source.replace(beforeIsTimeout, '');

          fs.writeFileSync(path, source);
          NODE
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/approval-runtime-cloudflare/src/workflow.ts
          git commit --no-verify -m "fix: Workflow control-flow errorを捕捉しない"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
