name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          cache: true
      - name: Install dependencies
        run: vp install
      - name: Apply Result type fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/approval-core/src/materialization.ts")
          text = path.read_text()
          old = 'function cloneDomain<T>(value: T, path = "$"‌): Result.Result<T, MaterializationFailure> {'
          # zero-width marker is intentionally removed below so the shell/YAML cannot rewrite `$`.
          old = old.replace("‌", "")
          new = 'function cloneDomain<T>(value: T, path = "$"‌): Result.Result<Awaited<T>, MaterializationFailure> {'
          new = new.replace("‌", "")
          assert text.count(old) == 1, "cloneDomain signature pattern mismatch"
          text = text.replace(old, new)
          old = "  return Result.succeed(cloned.value as T);"
          new = "  return Result.succeed(cloned.value as Awaited<T>);"
          assert text.count(old) == 1, "cloneDomain return pattern mismatch"
          path.write_text(text.replace(old, new))

          path = Path("packages/approval-core/src/testing/id.ts")
          text = path.read_text()
          old = "      return Result.succeed(id);"
          new = "      return Result.succeed(id) as Result.Result<Id, DeterministicIdExhaustedError>;"
          assert text.count(old) == 1, "id Result pattern mismatch"
          path.write_text(text.replace(old, new))

          path = Path("packages/approval-d1/src/materialized-plan-repository.ts")
          text = path.read_text()
          old = '''const firstRow = Result.fn({
            try: async <T>(statement: D1PreparedStatementLike): Promise<T | null> => statement.first<T>(),
            catch: (error): D1RepositoryError => repositoryError(error, "D1 rowの取得に失敗しました"),
          });'''
          new = '''const firstStoredPlanRow = Result.fn({
            try: async (statement: D1PreparedStatementLike): Promise<StoredPlanRow | null> =>
              statement.first<StoredPlanRow>(),
            catch: (error): D1RepositoryError => repositoryError(error, "D1 rowの取得に失敗しました"),
          });'''
          assert text.count(old) == 1, "firstRow definition pattern mismatch"
          text = text.replace(old, new)
          old = "    return firstRow<StoredPlanRow>("
          new = "    return firstStoredPlanRow("
          assert text.count(old) == 1, "firstRow call pattern mismatch"
          path.write_text(text.replace(old, new))
          PY
          vp check --fix || true
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit --no-verify -m "fix: byethrowの型推論を調整"
            git push
          fi
