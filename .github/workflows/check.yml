name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Vite+
        run: bun install -g vite-plus@0.2.8
      - name: Install dependencies
        run: vp install
      - name: Check
        run: vp check
      - name: Test
        run: vp test
