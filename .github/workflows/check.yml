name: check

on:
  push:
    branches: [refactor/policy-result-byethrow]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refactor/policy-result-byethrow
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          cache: true
      - name: Install dependencies
        run: vp install
      - name: Apply Result migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str):
              text = path.read_text()
              assert text.count(old) == 1, f"pattern mismatch: {path}: {old[:80]!r}"
              path.write_text(text.replace(old, new))

          path = Path("packages/approval-core/src/materialization.ts")
          replace_once(path, '''  if (bindingResolution.type === "error") {
            return asMaterializationError(
              new MaterializationFailure(
                "binding_resolution_error",
                bindingResolution.error.message,
                bindingResolution.error.path,
              ),
            );
          }

          const policyBindingSnapshots: PolicyBindingSnapshot[] = [];
          const materializedFlows: MaterializedFlow[] = [];

          for (const binding of bindingResolution.bindings) {''', '''  if (Result.isFailure(bindingResolution)) {
            return asMaterializationError(
              new MaterializationFailure(
                "binding_resolution_error",
                bindingResolution.error.cause.message,
                bindingResolution.error.cause.path,
              ),
            );
          }

          const policyBindingSnapshots: PolicyBindingSnapshot[] = [];
          const materializedFlows: MaterializedFlow[] = [];

          for (const binding of bindingResolution.value) {''')

          replace_once(path, '''    const evaluation = evaluatePolicy(source.policy, input.context);
            if (evaluation.type === "error") {
              return asMaterializationError(
                new MaterializationFailure(
                  "policy_evaluation_error",
                  evaluation.error.message,
                  evaluation.error.path,
                ),
              );
            }
''', '''    const evaluation = evaluatePolicy(source.policy, input.context);
            if (Result.isFailure(evaluation)) {
              return asMaterializationError(
                new MaterializationFailure(
                  "policy_evaluation_error",
                  evaluation.error.cause.message,
                  evaluation.error.cause.path,
                ),
              );
            }
''')

          text = path.read_text()
          text = text.replace('''    const outcome: PolicyBindingSnapshotOutcome =
              evaluation.type === "matched"
                ? { type: "matched", ruleKey: evaluation.ruleKey, flowType: evaluation.flow.type }
                : { type: "not_matched" };''', '''    const outcome: PolicyBindingSnapshotOutcome =
              evaluation.value.type === "matched"
                ? {
                    type: "matched",
                    ruleKey: evaluation.value.ruleKey,
                    flowType: evaluation.value.flow.type,
                  }
                : { type: "not_matched" };''')
          text = text.replace('''    if (evaluation.type === "matched" && evaluation.flow.type !== "none") {
              const materialized = await materializeFlow(
                evaluation.flow,''', '''    if (evaluation.value.type === "matched" && evaluation.value.flow.type !== "none") {
              const materialized = await materializeFlow(
                evaluation.value.flow,''')
          path.write_text(text)

          path = Path("tests/acceptance/m1-policy-core.test.ts")
          text = path.read_text()
          text = text.replace('import { describe, expect, it } from "vite-plus/test";\n', 'import { Result } from "@praha/byethrow";\nimport { describe, expect, it } from "vite-plus/test";\n', 1)

          old = '''    const result = evaluatePolicy(policy, ticketContext());

              expect(result.type).toBe("matched");
              if (result.type !== "matched") return;
              expect(String(result.ruleKey)).toBe("critical");
              expect(result.flow).toEqual(managerFlow);'''
          new = '''    const result = evaluatePolicy(policy, ticketContext());

              expect(Result.isSuccess(result)).toBe(true);
              if (Result.isFailure(result)) return;
              expect(result.value.type).toBe("matched");
              if (result.value.type !== "matched") return;
              expect(String(result.value.ruleKey)).toBe("critical");
              expect(result.value.flow).toEqual(managerFlow);'''
          assert text.count(old) == 1, "AC-M1-001 pattern mismatch"
          text = text.replace(old, new)

          old = '''    expect(first).toEqual(second);
              expect(first.type).toBe("compiled");
              if (first.type !== "compiled") return;
              expect(first.flow).toEqual({
                type: "serial",
                children: [managerFlow, securityFlow],
                constraints: { distinctApprovers: true },
              });'''
          new = '''    expect(first).toEqual(second);
              expect(Result.isSuccess(first)).toBe(true);
              if (Result.isFailure(first)) return;
              expect(first.value.flow).toEqual({
                type: "serial",
                children: [managerFlow, securityFlow],
                constraints: { distinctApprovers: true },
              });'''
          assert text.count(old) == 1, "AC-M1-002 pattern mismatch"
          text = text.replace(old, new)

          old = '''    expect(mixed.type === "compiled" ? mixed.flow : mixed).toEqual(managerFlow);

              const onlyNone = evaluateApprovalPlan({
                context: ticketContext(),
                bindings: [noApprovalBinding],
                policies: [noApprovalPolicy],
              });
              expect(onlyNone.type === "compiled" ? onlyNone.flow : onlyNone).toEqual({ type: "none" });'''
          new = '''    expect(mixed).toMatchObject({ type: "Success", value: { flow: managerFlow } });

              const onlyNone = evaluateApprovalPlan({
                context: ticketContext(),
                bindings: [noApprovalBinding],
                policies: [noApprovalPolicy],
              });
              expect(onlyNone).toMatchObject({
                type: "Success",
                value: { flow: { type: "none" } },
              });'''
          assert text.count(old) == 1, "AC-M1-003 pattern mismatch"
          text = text.replace(old, new)

          old = '''    expect(evaluateCondition(condition, purchaseContext({ currency: "JPY" }))).toMatchObject({
                type: "error",
                code: "field_missing",
              });
              expect(
                evaluateCondition(condition, purchaseContext({ amountMinor: "500000", currency: "JPY" })),
              ).toMatchObject({ type: "error", code: "type_mismatch" });
              expect(
                evaluateCondition(
                  condition,
                  purchaseContext({ amountMinor: Number.MAX_SAFE_INTEGER + 1, currency: "JPY" }),
                ),
              ).toMatchObject({ type: "error", code: "invalid_number" });'''
          new = '''    expect(evaluateCondition(condition, purchaseContext({ currency: "JPY" }))).toMatchObject({
                type: "Failure",
                error: { code: "field_missing" },
              });
              expect(
                evaluateCondition(condition, purchaseContext({ amountMinor: "500000", currency: "JPY" })),
              ).toMatchObject({ type: "Failure", error: { code: "type_mismatch" } });
              expect(
                evaluateCondition(
                  condition,
                  purchaseContext({ amountMinor: Number.MAX_SAFE_INTEGER + 1, currency: "JPY" }),
                ),
              ).toMatchObject({ type: "Failure", error: { code: "invalid_number" } });'''
          assert text.count(old) == 1, "AC-M1-004 pattern mismatch"
          text = text.replace(old, new)

          text = text.replace('''      evaluateCondition(condition, purchaseContext({ amountMinor: 499_999, currency: "JPY" })).type,
            ).toBe("not_matched");''', '''      evaluateCondition(condition, purchaseContext({ amountMinor: 499_999, currency: "JPY" })),
            ).toMatchObject({ type: "Success", value: { type: "not_matched" } });''')
          text = text.replace('''      evaluateCondition(condition, purchaseContext({ amountMinor: 500_000, currency: "JPY" })).type,
            ).toBe("matched");''', '''      evaluateCondition(condition, purchaseContext({ amountMinor: 500_000, currency: "JPY" })),
            ).toMatchObject({ type: "Success", value: { type: "matched" } });''')
          text = text.replace('''      evaluateCondition(condition, purchaseContext({ amountMinor: 500_001, currency: "JPY" })).type,
            ).toBe("matched");''', '''      evaluateCondition(condition, purchaseContext({ amountMinor: 500_001, currency: "JPY" })),
            ).toMatchObject({ type: "Success", value: { type: "matched" } });''')
          text = text.replace('''      evaluateCondition(condition, purchaseContext({ amountMinor: 500_001, currency: "USD" })).type,
            ).toBe("not_matched");''', '''      evaluateCondition(condition, purchaseContext({ amountMinor: 500_001, currency: "USD" })),
            ).toMatchObject({ type: "Success", value: { type: "not_matched" } });''')

          old = '''    expect(result.type).toBe("resolved");
              if (result.type !== "resolved") return;
              expect(result.bindings.map((binding) => String(binding.id))).toEqual([
                "binding:exact",
                "binding:prefix",
              ]);'''
          new = '''    expect(Result.isSuccess(result)).toBe(true);
              if (Result.isFailure(result)) return;
              expect(result.value.map((binding) => String(binding.id))).toEqual([
                "binding:exact",
                "binding:prefix",
              ]);'''
          assert text.count(old) == 1, "AC-M1-006 pattern mismatch"
          text = text.replace(old, new)

          old = '''    expect(
              evaluateCondition(
                and(
                  gte(field("attributes.riskScore"), field("organization.settings.threshold")),
                  eq(field("actor.type"), literal("user")),
                ),
                context,
              ).type,
            ).toBe("matched");'''
          new = '''    expect(
              evaluateCondition(
                and(
                  gte(field("attributes.riskScore"), field("organization.settings.threshold")),
                  eq(field("actor.type"), literal("user")),
                ),
                context,
              ),
            ).toMatchObject({ type: "Success", value: { type: "matched" } });'''
          assert text.count(old) == 1, "field namespace pattern mismatch"
          text = text.replace(old, new)

          old = '''    expect(critical.type === "compiled" ? critical.flow : critical).toEqual(managerFlow);
              expect(normal.type === "compiled" ? normal.flow : normal).toEqual({ type: "none" });'''
          new = '''    expect(critical).toMatchObject({ type: "Success", value: { flow: managerFlow } });
              expect(normal).toMatchObject({
                type: "Success",
                value: { flow: { type: "none" } },
              });'''
          assert text.count(old) == 1, "ticket demo pattern mismatch"
          path.write_text(text)
          PY
          vp check --fix || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add packages/approval-core/src/materialization.ts tests/acceptance/m1-policy-core.test.ts
            git commit --no-verify -m "refactor: Result契約へ呼び出し側を追従"
            git push
          fi
