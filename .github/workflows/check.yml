name: check

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Fix pause/resume test assumption
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'packages/approval-runtime-cloudflare/src/workflow.integration.test.ts';
          const source = fs.readFileSync(path, 'utf8');
          const before = `    await instance.resume();\n    await introspector.waitForStatus("waiting");\n    await instance.sendEvent({`;
          const after = `    await instance.resume();\n    await instance.sendEvent({`;
          if (!source.includes(before)) process.exit(2);
          fs.writeFileSync(path, source.replace(before, after));
          NODE
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/approval-runtime-cloudflare/src/workflow.integration.test.ts
          git commit --no-verify -m "test: resume後のwaiting状態への過剰な依存を除去"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
