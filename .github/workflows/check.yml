name: check

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Use introspection API for internal waiting state
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'packages/approval-runtime-cloudflare/src/workflow.integration.test.ts';
          const source = fs.readFileSync(path, 'utf8');
          const before = `    const pausingInstance = await env.ACTION_WORKFLOW.get(id);\n    await vi.waitFor(\n      async () => {\n        expect((await pausingInstance.status()).status).toBe("waiting");\n      },\n      { timeout: 1_500 },\n    );\n    await pausingInstance.pause();`;
          const after = `    const waitingIntrospector = await introspectWorkflowInstance(env.ACTION_WORKFLOW, id);\n    await waitingIntrospector.waitForStatus("waiting");\n    await waitingIntrospector.dispose();\n\n    const pausingInstance = await env.ACTION_WORKFLOW.get(id);\n    await pausingInstance.pause();`;
          if (!source.includes(before)) process.exit(2);
          fs.writeFileSync(path, source.replace(before, after));
          NODE
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/approval-runtime-cloudflare/src/workflow.integration.test.ts
          git commit --no-verify -m "test: waitForEvent内部状態はintrospectionで確認"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
