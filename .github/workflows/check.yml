name: check

on:
  pull_request:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          cache: true
      - name: Fix D1 test schema setup
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const rootPath = 'package.json';
          const root = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
          root.devDependencies.vitest = '4.1.11';
          fs.writeFileSync(rootPath, `${JSON.stringify(root, null, 2)}\n`);

          const testPath = 'packages/approval-runtime-cloudflare/src/workflow.integration.test.ts';
          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replace(
            /await env\.DB\.exec\(`(CREATE TABLE[\s\S]*?)`\);/g,
            (_, sql) => `await env.DB.prepare(\`${sql}\`).run();`,
          );
          fs.writeFileSync(testPath, test);
          NODE
          vp install
          vp check --fix || true
      - name: Commit D1 setup fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --no-verify -m "fix: Cloudflare D1 schema setupをprepared statement化"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
