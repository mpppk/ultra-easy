name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          cache: true
      - name: Install dependencies
        run: vp install
      - name: Check
        run: vp check
      - name: Test
        run: vp test
