name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          cache: true
      - name: Install dependencies
        run: vp install
      - name: Check
        run: |
          vp check --fix
          git diff -- packages/approval-core/src/action-event.ts packages/approval-d1/src/action-event-repository.ts packages/approval-d1/src/action-result-projection-repository.ts packages/approval-d1/src/approval-runtime-projection-repository.integration.test.ts packages/approval-runtime-cloudflare/src/workflow.integration.test.ts packages/approval-runtime-cloudflare/src/workflow.ts
          exit 1
      - name: Build Web Preview
        run: vp -C apps/web run build:preview
      - name: Dry-run Approval Runtime Preview
        run: vp -C apps/approval-runtime run deploy:dry-run
      - name: Start OpenFGA test server
        run: |
          docker run --rm -d --name openfga-test -p 8080:8080 openfga/openfga:v1.18.1 run
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/healthz | grep -q '"status":"SERVING"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs openfga-test
          exit 1
      - name: Test
        env:
          OPENFGA_TEST_URL: http://127.0.0.1:8080
        run: vp run -r test
      - name: Stop OpenFGA test server
        if: always()
        run: docker rm -f openfga-test || true
