name: routegen-preview

on:
  push:
    branches: [preview/approval-runtime-harness]

jobs:
  routegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp fmt apps/approval-runtime/src/index.ts
      - name: Show formatter diff
        run: |
          git diff -- apps/approval-runtime/src/index.ts
          exit 1
