name: routegen-preview

on:
  push:
    branches: [preview/approval-runtime-harness]

jobs:
  routegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: "24"
          cache: true
      - run: vp install
      - run: vp check
      - run: vp -C apps/web run build:preview
      - run: vp -C apps/approval-runtime run deploy:dry-run
