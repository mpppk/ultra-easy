name: format-debug

on:
  push:
    branches:
      - feat/m7-3-outbox-notifications

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: 24
      - run: vp install
      - name: Apply repository fixes
        run: vp check --fix || true
      - name: Print formatter diff
        run: |
          git diff -- \
            packages/approval-d1/src/index.ts \
            packages/approval-d1/src/notification-outbox-repository.ts \
            packages/approval-runtime-cloudflare/src/index.ts \
            packages/approval-runtime-cloudflare/src/notifications.integration.test.ts
