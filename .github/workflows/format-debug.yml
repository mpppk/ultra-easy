name: format-debug

on:
  push:
    branches:
      - feat/m7-6-observability-rate-limit

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: 24
      - run: vp install
      - name: Apply repository fixes
        run: vp check --fix || true
      - name: Print formatter diff
        run: |
          git diff -- \
            docs/observability.md \
            packages/approval-core/src/observability.ts \
            packages/approval-core/src/rate-limit.ts \
            packages/approval-fga/src/openfga.test.ts \
            packages/approval-runtime-cloudflare/src/service-binding.test.ts \
            packages/approval-runtime-cloudflare/src/workflow.ts
