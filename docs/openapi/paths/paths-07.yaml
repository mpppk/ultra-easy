/v1/organizations/{organizationId}/approval-policies/{policyKey}/versions/{version}:
  get:
    tags:
    - ApprovalPolicies
    operationId: getApprovalPolicyVersion
    summary: Published Approval Policy Version を取得する
    parameters:
    - $ref: ../components/common.yaml#/parameters/OrganizationId
    - $ref: ../components/common.yaml#/parameters/PolicyKey
    - $ref: ../components/common.yaml#/parameters/Version
    responses:
      '200':
        description: Version。
        content:
          application/json:
            schema:
              $ref: ../components/schemas-06.yaml#/ApprovalPolicyVersion
      '404':
        $ref: ../components/common.yaml#/responses/NotFound
/v1/organizations/{organizationId}/approval-policy-bindings:
  get:
    tags:
    - ApprovalPolicyBindings
    operationId: listApprovalPolicyBindings
    summary: ApprovalPolicyBinding を一覧する
    parameters:
    - $ref: ../components/common.yaml#/parameters/OrganizationId
    - $ref: ../components/common.yaml#/parameters/Cursor
    - $ref: ../components/common.yaml#/parameters/Limit
    - name: enabled
      in: query
      schema:
        type: boolean
    - name: actionType
      in: query
      schema:
        type: string
    responses:
      '200':
        description: Binding 一覧。
        content:
          application/json:
            schema:
              $ref: ../components/schemas-06.yaml#/ApprovalPolicyBindingPage
  post:
    tags:
    - ApprovalPolicyBindings
    operationId: createApprovalPolicyBinding
    summary: Binding 作成を ActionRequest として要求する
    parameters:
    - $ref: ../components/common.yaml#/parameters/OrganizationId
    - $ref: ../components/common.yaml#/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas-06.yaml#/ApprovalPolicyBindingMutation
    responses:
      '201':
        description: Binding 作成操作用 ActionRequest。
        content:
          application/json:
            schema:
              $ref: ../components/schemas-01.yaml#/ActionRequest
      '409':
        $ref: ../components/common.yaml#/responses/Conflict
      '422':
        $ref: ../components/common.yaml#/responses/UnprocessableEntity
