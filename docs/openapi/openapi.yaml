    $ref: ./paths/paths-01.yaml#/~1v1~1organizations~1{organizationId}~1action-requests
  /v1/organizations/{organizationId}/action-requests/simulate:
    $ref: ./paths/paths-01.yaml#/~1v1~1organizations~1{organizationId}~1action-requests~1simulate
  /v1/organizations/{organizationId}/action-requests/{actionRequestId}:
    $ref: ./paths/paths-02.yaml#/~1v1~1organizations~1{organizationId}~1action-requests~1{actionRequestId}
  /v1/organizations/{organizationId}/action-requests/{actionRequestId}/cancel:
