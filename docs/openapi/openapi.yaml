openapi: 3.1.0
info:
  title: Approval Workflow Platform API
  version: 1.0.0
  description: 'ActionRequest を統一入口とする承認ワークフロー基盤の HTTP API。

    actor / caller / authority principal は認証およびサーバー側の Input Adapter で解決し、

    ActionRequest 作成 body から任意指定させない。

    詳細な Policy / Flow semantics は「承認ワークフロー基盤 仕様書 v1.0」を参照する。

    '
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
security:
- bearerAuth: []
tags:
- name: ActionRequests
- name: ApprovalTasks
- name: ApprovalCommands
- name: ActionDefinitions
- name: ApprovalPolicies
- name: ApprovalPolicyBindings
- name: Delegations
paths:
